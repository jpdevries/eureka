name: CI

on:
  push:
    branches: [v3]
  pull_request:
    branches: [v3]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, unit tests, build, schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run validate:schemas
      - name: Pack every publishable package (dry run)
        run: for p in packages/*; do npm pack --dry-run -w "$p" > /dev/null; done
      - name: Bundle sizes
        run: node packages/element/build.mjs

  conformance:
    name: Conformance suite (v3)
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
        working-directory: spec/conformance
      - run: npm run conformance:v3
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: conformance-v3-results
          path: spec/conformance/results
          retention-days: 7
