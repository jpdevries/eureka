name: Publish to npm

# Changesets flow, second half: started by hand from the Actions tab (or `gh
# workflow run publish.yml --ref v3`). Publishes every @mrktps/eureka* package whose
# version is not on npm yet, with provenance, and pushes the release tags.
on:
  workflow_dispatch:

concurrency: publish

permissions:
  contents: write
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Refuse to publish with pending changesets
        # In pre-release mode applied changesets stay in .changeset/ and are listed in pre.json; anything else is pending.
        run: |
          node -e '
            const fs = require("fs");
            const applied = new Set((fs.existsSync(".changeset/pre.json") ? JSON.parse(fs.readFileSync(".changeset/pre.json", "utf8")).changesets : []) ?? []);
            const pending = fs.readdirSync(".changeset").filter((f) => f.endsWith(".md") && f !== "README.md" && !applied.has(f.slice(0, -3)));
            if (pending.length) { console.error("Pending changesets: " + pending.join(", ") + ". Merge the version pull request first."); process.exit(1); }
            console.log("No pending changesets.");
          '
      - run: npx changeset publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: git push --follow-tags
