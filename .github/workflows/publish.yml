name: Publish to npm

# Changesets flow, second half: started by hand from the Actions tab (or `gh
# workflow run publish.yml --ref v3`). Publishes every @eureka/* package whose
# version is not on npm yet, with provenance, and pushes the release tags.
on:
  workflow_dispatch:

concurrency: publish

permissions:
  contents: write
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Refuse to publish with pending changesets
        run: |
          if ls .changeset/*.md 2>/dev/null | grep -v README.md | grep -q .; then
            echo "Pending changesets found; merge the version pull request first." >&2
            exit 1
          fi
      - run: npx changeset publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: git push --follow-tags
