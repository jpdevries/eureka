<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Client-only · Eureka 3 demo</title>
<meta name="color-scheme" content="light dark">
<link rel="stylesheet" href="/assets/css/eureka.css">
<link rel="stylesheet" href="/assets/demo.css">
</head>
<body class="demo-page demo-page--browser">
<nav class="demo-nav" aria-label="Demo pages"><a class="demo-brand" href="/">Eureka 3</a><ul><li><a href="/">Home</a></li><li><a href="/browser/">Server-rendered</a></li><li><a href="/client.html" aria-current="page">Client-only</a></li><li><a href="/react.html">React</a></li><li><a href="/embed.html">Embed</a></li></ul><a class="demo-nav-link" href="https://github.com/jpdevries/eureka/tree/v3">Source</a></nav>
<main class="demo-main">
<h1 class="visually-hidden">Eureka Media Browser</h1>
<div id="root" class="eureka-root">
  <!-- No server-rendered form: the element fetches sources, tree and listing itself (spec 07 STATE-40). -->
  <eureka-browser api="/browser/" assets="/assets/" storage-prefix="eureka_client__"></eureka-browser>
  <noscript><p style="padding:1rem">This page needs JavaScript. The <a href="/browser/">server-rendered page</a> works without it.</p></noscript>
</div>
</main>
<script type="module">
  const el = document.querySelector('eureka-browser');
  el.config = { callbacks: { choose: (items) => alert(`Chose:\n${[].concat(items).map((i) => i.path).join('\n')}`) } };
  el.addEventListener('eureka-error', (e) => console.error('eureka-error', e.detail));
</script>
<script type="module" src="/assets/js/eureka-browser.js"></script>
</body>
</html>
